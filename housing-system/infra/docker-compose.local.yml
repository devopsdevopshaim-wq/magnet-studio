# DiraFinder - סטאק מקומי מינימלי (Postgres בלבד כברירת מחדל).
# הרצה:  docker compose -f docker-compose.local.yml --env-file .env.local up -d
# עם n8n:  ... --profile full up -d
name: dira-local

services:
  db:
    image: postgres:16-alpine
    container_name: dira-local-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - dira_local_db:/var/lib/postgresql/data
      - ../db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:latest
    container_name: dira-local-n8n
    restart: unless-stopped
    profiles: ["full"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5681:5678"
    environment:
      N8N_USER_MANAGEMENT_DISABLED: "true"
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: Asia/Jerusalem
      TZ: Asia/Jerusalem
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_DATABASE: ${DB_NAME}
      DB_POSTGRESDB_USER: ${DB_USER}
      DB_POSTGRESDB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dira_local_n8n:/home/node/.n8n

volumes:
  dira_local_db:
  dira_local_n8n:
