# Render Blueprint — פריסת "הפנקס היומי" לכתובת ציבורית.
# איך: render.com → New → Blueprint → מחברים את ה-repo מ-GitHub → Apply.
#      אם השירות כבר קיים: Render Dashboard → השירות → Settings → "Sync render.yaml" (או Manual Deploy → Deploy latest commit),
#      ולאשר את שדרוג התוכנית ל-Starter (יש עלות — כרטיס אשראי כבר על התיק אם הוגדר בעבר).
# חובה למלא PNKS_AUTH_PASSWORD (סיסמת גישה) לפני שהאתר עולה.
#
# מה עובד בענן:  מענה יומי, לוח עברי, תהילים, קריאה, כספים, שוק ההון, לוטו, דיבוב קולי (Google TTS),
#                עכשיו גם נשמר לצמיתות: אינטגרציות/מפתחות API, נתוני עסק (חשבוניות/לקוחות/הנה"ח), פרויקטי AIA, פרופיל, ערוצי טלוויזיה מותאמים.
# מה עדיין לא (דורש את המחשב עצמו, לא קשור לדיסק):  סיכום ה-AI מ-Ollama המקומי, DevOps/Docker/n8n, קריאת תיקיות עיצוב, Outlook.

services:
  - type: web
    name: hapinkas-hayomi
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter          # דיסק קבוע דורש תוכנית בתשלום (לא נתמך ב-free) — ~7$/חודש
    region: frankfurt
    healthCheckPath: /healthz
    autoDeploy: true       # כל push ל-branch הראשי מפרסם מחדש
    disk:
      name: pnks-data
      mountPath: /app/data # אותה תיקייה ש-DATA_DIR בשרת קורא/כותב אליה — עכשיו שורדת redeploy
      sizeGB: 1             # ~0.25$/חודש נוסף — מספיק בנדיבות לכל ה-JSON/נכסים/רינדורים
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4420
      - key: DISABLE_DOCKER_ORCHESTRATION
        value: "1"
      - key: PNKS_AUTH_PASSWORD
        sync: false        # מגדירים ידנית בלוח של Render — לא נשמר ב-git
      - key: PNKS_AUTH_SECRET
        generateValue: true
      # חובה למערכת הרב-משתמשית (חשבונות/פאנל מנהל) — מגדירים ידנית בלוח של Render:
      - key: DATABASE_URL   # מחרוזת חיבור Postgres (Neon) — ראו lib/db.js, lib/accounts.js
        sync: false
      - key: ADMIN_EMAIL    # המייל שמזהה את חשבון המנהל — ראו lib/accounts.js (isAdminEmail)
        sync: false
      # אופציונלי — הקראה אנושית יותר:
      - key: AZURE_SPEECH_KEY
        sync: false
      - key: AZURE_SPEECH_REGION
        value: westeurope
      # אופציונלי — שער Maton (Gmail/Drive/Calendar/Slack/YouTube מאוחד). כרגע מוגדר רק במחשב
      # המקומי (env var) — כדי שגם הענן/הטלפון יתחברו, מוסיפים את אותו ערך כאן בלוח של Render.
      - key: MATON_API_KEY
        sync: false
      # אופציונלי — מפתח AI בענן (Claude/Anthropic) לתכונות AI שדורשות רשת ולא את Ollama המקומי.
      - key: ANTHROPIC_API_KEY
        sync: false
    # דיסק קבוע מחובר ב-/app/data (ראו disk למעלה) — data/*.json, data/aia/*, data/business/* וכו' שורדים redeploy.
    # נתוני המשתמש בכספים (מחשבון) עדיין ב-localStorage של הדפדפן בנוסף.
