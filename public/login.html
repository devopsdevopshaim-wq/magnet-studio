<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>HKDAILY — כניסה</title>
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#060a14" />
<style>
  :root {
    --bg: #060a14; --surface: rgba(11,21,38,0.82); --surface-2: rgba(16,31,56,0.86);
    --brass: #3ec6ff; --brass-soft: #8fdcff; --ember: #00d4ff;
    --cream: #e6f1fb; --cream-dim: #7f93ab; --danger: #ff5470; --good: #4ee0b0;
    --line: rgba(62,198,255,0.24);
    --font-display: "Frank Ruhl Libre", "Times New Roman", serif;
    --font-body: "Assistant", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--cream);
    font-family: var(--font-body); display: grid; place-items: center; padding: 1.5rem;
  }
  .card {
    width: 100%; max-width: 22rem; background: var(--surface);
    border: 1px solid var(--line); border-radius: 16px; padding: 2rem 1.6rem;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .mark { display: block; width: 46px; height: 46px; margin: 0 auto 1rem; color: var(--brass); }
  h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; text-align: center; margin: 0 0 0.3rem; }
  p.sub { text-align: center; color: var(--cream-dim); font-size: 0.88rem; margin: 0 0 1.3rem; }
  .tabs { display: flex; gap: 0.4rem; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 0.25rem; margin-bottom: 1.3rem; }
  .tab {
    flex: 1; text-align: center; padding: 0.5rem 0.4rem; border-radius: 7px; cursor: pointer;
    font-size: 0.88rem; color: var(--cream-dim); font-weight: 600; user-select: none;
  }
  .tab.active { background: var(--brass); color: #04101c; }
  label { display: block; font-size: 0.82rem; color: var(--cream-dim); margin-bottom: 0.4rem; }
  .field { margin-bottom: 0.9rem; }
  .field:last-of-type { margin-bottom: 0; }
  input {
    width: 100%; background: var(--surface-2); color: var(--cream);
    border: 1px solid var(--line); border-radius: 9px; padding: 0.7rem 0.8rem;
    font-family: var(--font-body); font-size: 1rem;
  }
  input:focus-visible { outline: 2px solid var(--ember); outline-offset: 1px; }
  button {
    width: 100%; margin-top: 1.1rem; padding: 0.75rem; border: 0; border-radius: 9px;
    background: var(--brass); color: #04101c; font-family: var(--font-body);
    font-weight: 700; font-size: 0.98rem; cursor: pointer;
  }
  button:hover { background: var(--brass-soft); }
  button:disabled { opacity: 0.6; cursor: wait; }
  .msg { margin-top: 0.9rem; font-size: 0.85rem; text-align: center; min-height: 1.2em; color: var(--danger); }
  .msg.ok { color: var(--good); }
  .hint { margin-top: 1rem; font-size: 0.78rem; color: var(--cream-dim); text-align: center; line-height: 1.5; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="card">
    <svg class="mark" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <polygon points="24,4 41,14 41,34 24,44 7,34 7,14" stroke="currentColor" stroke-width="2.5"/>
      <polygon points="24,13 33,18 33,30 24,35 15,30 15,18" fill="var(--bg,#060a14)" stroke="currentColor" stroke-width="1"/>
      <path d="M19 17v14M29 17v14M19 24h10" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
    </svg>
    <h1>HKDAILY</h1>
    <p class="sub" id="sub">הַפִּנְקָס הַיּוֹמִי — מערכת ניהול אישית, לכל אחד הנתונים שלו.</p>

    <div class="tabs">
      <div class="tab active" id="tabLogin">כניסה</div>
      <div class="tab" id="tabRegister">משתמש חדש</div>
    </div>

    <form id="f">
      <div class="field">
        <label for="name" id="nameLabel">שם (השאירו ריק לכניסת הבעלים)</label>
        <input type="text" id="name" autocomplete="username" />
      </div>
      <div class="field">
        <label for="pw">סיסמה</label>
        <input type="password" id="pw" autocomplete="current-password" />
      </div>
      <div class="field" id="pw2Field" hidden>
        <label for="pw2">אימות סיסמה</label>
        <input type="password" id="pw2" autocomplete="new-password" />
      </div>
      <button type="submit" id="btn">כניסה</button>
      <div class="msg" id="msg"></div>
      <div class="hint" id="hint">משתמש חדש? עברו ללשונית "משתמש חדש" למעלה כדי ליצור חשבון פרטי משלכם — עם נתונים, לקוחות וחשבוניות נפרדים לגמרי מכל חשבון אחר במערכת.</div>
    </form>
  </div>
  <script>
    var mode = "login";
    var f = document.getElementById("f"), msg = document.getElementById("msg"), btn = document.getElementById("btn");
    var tabLogin = document.getElementById("tabLogin"), tabRegister = document.getElementById("tabRegister");
    var nameLabel = document.getElementById("nameLabel"), pw2Field = document.getElementById("pw2Field");
    var sub = document.getElementById("sub"), hint = document.getElementById("hint");
    var next = new URLSearchParams(location.search).get("next") || "/daily.html";
    if (!/^\/[^\/]/.test(next)) next = "/daily.html";

    function setMode(m) {
      mode = m;
      msg.textContent = ""; msg.className = "msg";
      tabLogin.classList.toggle("active", m === "login");
      tabRegister.classList.toggle("active", m === "register");
      if (m === "login") {
        nameLabel.textContent = "שם (השאירו ריק לכניסת הבעלים)";
        pw2Field.hidden = true;
        btn.textContent = "כניסה";
        sub.textContent = "מערכת ניהול אישית — לכל אחד הנתונים שלו.";
        hint.textContent = "משתמש חדש? עברו ללשונית \"משתמש חדש\" למעלה כדי ליצור חשבון פרטי משלכם — עם נתונים, לקוחות וחשבוניות נפרדים לגמרי מכל חשבון אחר במערכת.";
      } else {
        nameLabel.textContent = "שם מלא";
        pw2Field.hidden = false;
        btn.textContent = "יצירת חשבון";
        sub.textContent = "יצירת חשבון פרטי — הנתונים שלכם יהיו שלכם בלבד.";
        hint.textContent = "החשבון החדש מקבל מרחב נתונים נפרד לגמרי: פרופיל, לקוחות, חשבוניות, יומן ותוכן משלו. שום דבר לא משותף עם חשבונות אחרים.";
      }
    }
    tabLogin.addEventListener("click", function () { setMode("login"); });
    tabRegister.addEventListener("click", function () { setMode("register"); });

    f.addEventListener("submit", async function (e) {
      e.preventDefault();
      msg.className = "msg"; msg.textContent = "";
      var name = document.getElementById("name").value.trim();
      var pw = document.getElementById("pw").value;

      if (mode === "register") {
        if (!name) { msg.textContent = "צריך להזין שם"; return; }
        var pw2 = document.getElementById("pw2").value;
        if (pw !== pw2) { msg.textContent = "הסיסמאות לא תואמות"; return; }
      }

      btn.disabled = true;
      try {
        var url = mode === "register" ? "/api/auth/register" : "/api/auth/login";
        var r = await fetch(url, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: name, password: pw })
        });
        var j = await r.json();
        if (r.ok && j.ok) {
          msg.className = "msg ok";
          msg.textContent = mode === "register" ? "החשבון נוצר! מעביר אתכם פנימה…" : "התחברות הצליחה…";
          setTimeout(function () { location.href = next; }, 400);
          return;
        }
        msg.textContent = j.error || "שגיאה — נסו שוב";
      } catch (err) { msg.textContent = "שגיאת רשת — נסו שוב"; }
      btn.disabled = false;
    });
  </script>
<script src="/js/fx-neural.js" defer></script>
</body>
</html>
