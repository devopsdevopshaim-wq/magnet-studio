<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>עיצוב פנים · HKDAILY</title>
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/tab-themes.css" />
<style>
  body { overflow: hidden; padding-bottom: 0 !important; }
  .int-shell { display: flex; flex-direction: column; height: calc(100vh - 46px); }
  body.dock-collapsed .int-shell { height: calc(100vh - 26px); }
  .int-bar {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 11px 20px; border-bottom: 1px solid var(--line); background: var(--surface);
  }
  .int-bar .brand-mini { font-family: var(--font-display); font-weight: 500; font-size: 1.1rem; color: var(--cream); }
  .int-bar nav { display: flex; gap: 2px; flex-wrap: wrap; }
  .int-bar nav a {
    text-decoration: none; font-size: 0.82rem; font-weight: 500; padding: 5px 12px; color: var(--cream-dim);
    border-bottom: 2px solid transparent;
  }
  .int-bar nav a:hover { color: var(--cream); }
  .int-bar nav a.active { color: var(--ember); border-bottom-color: var(--ember); }
  .int-bar .status-pill {
    margin-inline-start: auto; font-family: var(--font-mono); font-size: 0.74rem;
    padding: 4px 12px; border: 1px solid var(--line); border-radius: 999px; color: var(--cream-dim);
  }
  .int-bar .status-pill.up { border-color: var(--sage); color: var(--sage); }
  .int-bar .status-pill.down { border-color: var(--danger); color: var(--danger); }
  .int-bar button {
    font-family: var(--font-body); font-size: 0.76rem; padding: 6px 13px; cursor: pointer;
    background: none; color: var(--cream-dim); border: 1px solid var(--line); border-radius: 2px;
  }
  .int-bar button:hover { border-color: var(--brass); color: var(--brass-soft); }
  iframe#int { flex: 1; width: 100%; border: 0; background: #f2f3f6; }
</style>
</head>
<body class="theme-interior">
<div class="int-shell">
  <div class="int-bar">
    <span class="brand-mini">עיצוב פנים</span>
    <nav>
      <a href="/">לוח בקרה</a>
      <a href="/daily.html">מענה יומי</a>
      <a href="/jarvis.html">צ'אט AI</a>
      <a href="/housing.html">דיור</a>
      <a href="/vacation.html">חופשות</a>
      <a href="/interior.html" class="active">עיצוב פנים</a>
      <a href="/books.html">סטודיו ספרים</a>
      <a href="/jobs.html">דרושים</a>
      <a href="/finance.html">פיננסים</a>
      <a href="/health.html">בריאות</a>
      <a href="/fitness.html">כושר</a>
      <a href="/devops.html">DevOps</a>
      <a href="/aia.html">עיצוב AIA</a>
      <a href="/torah.html">ספריית קודש</a>
      <a href="/holidays.html">הלכות חגים</a>
      <a href="/marketing.html">פרסום ושיווק</a>
      <a href="/logo.html">לוגו</a>
      <a href="/business.html">ניהול עסק</a>
      <a href="/social.html">רשתות חברתיות</a>
      <a href="/tv.html">טלוויזיה</a>
      <a href="/library.html">אוצר לחג</a>
      <a href="/device.html">המכשיר</a>
      <a href="/graphology.html">גרפולוגיה</a>
      <a href="/astro-full.html">אסטרולוגיה</a>
      <a href="/editor.html">עורך מסגרות</a>
      <a href="/mail.html">מיילים</a>
      <a href="/setup.html">הגדרות</a>
      <a href="/analytics.html">נתוני שימוש</a>
    </nav>
    <span class="status-pill" id="status-pill">טוען…</span>
    <button id="btn-open" onclick="window.open('/interior/landing','_blank')">פתיחה בחלון</button>
  </div>

  <iframe id="int" src="/interior/landing" title="מתאר · תכנון פנים"></iframe>
</div>

<script>
  const pill = document.getElementById("status-pill");
  const el = document.getElementById("int");
  el.addEventListener("load", () => { pill.textContent = "מחובר"; pill.className = "status-pill up"; });
  setTimeout(() => { if (pill.textContent === "טוען…") { pill.textContent = "לא זמין כרגע"; pill.className = "status-pill down"; } }, 12000);
</script>
<script src="/js/dockbar.js" defer></script>
<script src="/js/share.js" defer></script>
</body>
</html>
