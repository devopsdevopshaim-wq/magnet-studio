<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>עוזר JARVIS · חיים קריספין</title>
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/jarvis.css" />
</head>
<body>
<div class="jarvis-wrap">

  <header class="top-header">
    <div class="brand">
      <svg class="mark" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="24,4 41,14 41,34 24,44 7,34 7,14" stroke="currentColor" stroke-width="2.5"/>
        <polygon points="24,16 32,20.5 32,29.5 24,34 16,29.5 16,20.5" fill="currentColor" opacity="0.85"/>
      </svg>
      <div>
        <h1>עוזר JARVIS</h1>
        <div class="tagline">צ'אט רב-סוכנים · מחובר ל-n8n</div>
      </div>
    </div>
    <div class="header-meta">
      <button class="btn ghost" onclick="location.href='/'">חזרה ללוח הבקרה</button>
    </div>
  </header>

  <nav class="tabs">
    <a href="/">לוח בקרה</a>
    <a href="/daily.html">מענה יומי</a>
    <a href="/jarvis.html" class="active">עוזר JARVIS</a>
    <a href="/housing.html">דיור</a>
    <a href="/jobs.html">דרושים</a>
    <a href="/finance.html">פיננסים</a>
    <a href="/health.html">בריאות</a>
    <a href="/fitness.html">כושר</a>
    <a href="/devops.html">DevOps</a>
    <a href="/aia.html">עיצוב AIA</a>
    <a href="/torah.html">ספריית קודש</a>
    <a href="/marketing.html">פרסום ושיווק</a>
    <a href="/logo.html">לוגו</a>
    <a href="/business.html">ניהול עסק</a>
    <a href="/tv.html">טלוויזיה</a>
    <a href="/library.html">אוצר לחג</a>
    <a href="/device.html">המכשיר</a>
    <a href="/graphology.html">גרפולוגיה</a>
    <a href="/astro-full.html">אסטרולוגיה</a>
    <a href="/editor.html">עורך מסגרות</a>
    <a href="/mail.html">מיילים</a>
    <a href="/setup.html">הגדרות</a>
    <a href="/analytics.html">נתוני שימוש</a>
  </nav>

  <div class="jarvis-persona">
    <div id="jarvis-avatar"></div>
    <div class="jarvis-face-caption">JARVIS · <span class="state">כאן</span></div>
  </div>

  <div class="jarvis-statusbar">
    <span class="dot" id="status-dot"></span>
    <span id="status-text">בודק חיבור…</span>
    <span class="spacer"></span>
    <button id="btn-voice" title="מצב קול — דיבור והקראה">מצב קול: כבוי</button>
    <button id="btn-new-chat">שיחה חדשה</button>
    <button id="btn-settings">הגדרות ⚙</button>
  </div>

  <div class="jarvis-chat" id="chat"></div>

  <div class="jarvis-chips">
    <button class="chip" data-prefix="שלח לכל המחלקות: ">כל המחלקות</button>
    <button class="chip" data-prefix="מחקר: ">מחקר</button>
    <button class="chip" data-prefix="תכנון: ">תכנון</button>
    <button class="chip" data-prefix="קוד: ">קוד</button>
    <button class="chip" data-prefix="דעה שנייה: ">דעה שנייה</button>
  </div>

  <div class="jarvis-composer">
    <button class="jarvis-mic" id="btn-mic" title="דבר אליי" aria-label="דבר אליי">🎤</button>
    <textarea id="input" placeholder="כתוב הודעה ל-JARVIS…  (Enter לשליחה · Shift+Enter לשורה חדשה)"></textarea>
    <button class="btn primary" id="btn-send">שלח</button>
  </div>
  <div class="jarvis-voicebar" id="voicebar" hidden>
    <span id="voice-hint">מקשיב…</span>
    <button id="btn-stop-speak">הפסק הקראה</button>
  </div>

</div>

<div class="jarvis-modal-backdrop hidden" id="settings-modal">
  <div class="jarvis-modal">
    <h2>הגדרות חיבור JARVIS</h2>
    <div class="jarvis-field">
      <label>יעד</label>
      <div class="modes">
        <label><input type="radio" name="cfg-target" value="local" /> n8n מקומי (Docker)</label>
        <label><input type="radio" name="cfg-target" value="cloud" /> n8n Cloud</label>
      </div>
    </div>
    <div class="jarvis-field" data-target="local">
      <label for="cfg-local-base">כתובת n8n מקומי</label>
      <input type="text" id="cfg-local-base" dir="ltr" placeholder="http://localhost:5680" />
    </div>
    <div class="jarvis-field" data-target="local">
      <label for="cfg-local-path">Webhook path</label>
      <input type="text" id="cfg-local-path" dir="ltr" placeholder="jarvis" />
    </div>
    <div class="jarvis-field" data-target="cloud">
      <label for="cfg-base">כתובת בסיס של n8n Cloud</label>
      <input type="text" id="cfg-base" dir="ltr" />
    </div>
    <div class="jarvis-field" data-target="cloud">
      <label for="cfg-id">Webhook ID (Chat Trigger)</label>
      <input type="text" id="cfg-id" dir="ltr" />
    </div>
    <div class="jarvis-field" data-target="cloud">
      <label>מצב</label>
      <div class="modes">
        <label><input type="radio" name="cfg-mode" value="prod" /> Production</label>
        <label><input type="radio" name="cfg-mode" value="test" /> Test</label>
      </div>
    </div>
    <div class="jarvis-test-result" id="test-result"></div>
    <div class="jarvis-modal-actions">
      <button class="btn ghost" id="btn-test">בדיקת חיבור</button>
      <button class="btn ghost" id="btn-cancel">ביטול</button>
      <button class="btn primary" id="btn-save">שמור</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/js/avatar.js"></script>
<script src="/js/jarvis.js"></script>
<script src="/js/dockbar.js" defer></script>
</body>
</html>
